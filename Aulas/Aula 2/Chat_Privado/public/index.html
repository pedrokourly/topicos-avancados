<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat com Salas</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#8b5cf6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">
                💬 Chat com Salas
            </h1>
            <p class="text-gray-600">Conecte-se com pessoas em salas temáticas</p>
        </div>

        <!-- Main Chat Container -->
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <!-- Room Entry Section -->
            <div class="bg-gradient-to-r from-primary to-secondary p-6">
                <h2 class="text-white text-xl font-semibold mb-4">🚪 Entrar em uma Sala</h2>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input 
                        type="text" 
                        id="sala" 
                        placeholder="Digite o nome da sala (ex: tecnologia, jogos, música...)"
                        class="flex-1 px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-white focus:border-transparent placeholder-gray-500"
                    >
                    <button 
                        onclick="entrarSala()"
                        class="bg-white text-primary px-6 py-3 rounded-lg font-semibold hover:bg-gray-50 transition-colors duration-200 shadow-md hover:shadow-lg"
                    >
                        Entrar na Sala
                    </button>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="p-6">
                <!-- Current Room Indicator -->
                <div id="roomIndicator" class="hidden mb-4 p-3 bg-green-50 border-l-4 border-green-400 rounded-r-lg">
                    <p class="text-green-700">
                        <span class="font-semibold">🟢 Conectado na sala:</span> 
                        <span id="currentRoom" class="font-mono"></span>
                    </p>
                </div>

                <!-- Chat Messages -->
                <div class="bg-gray-50 rounded-xl p-4 mb-4 h-80 overflow-y-auto border">
                    <ul id="chat" class="space-y-2"></ul>
                    <div id="emptyState" class="text-center text-gray-500 mt-8">
                        <div class="text-6xl mb-2">💭</div>
                        <p>Entre em uma sala para começar a conversar!</p>
                    </div>
                </div>

                <!-- Message Input -->
                <div class="flex gap-3">
                    <input 
                        type="text" 
                        id="msg" 
                        placeholder="Digite sua mensagem aqui..."
                        disabled
                        class="flex-1 px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent disabled:bg-gray-100 disabled:cursor-not-allowed"
                        onkeypress="if(event.key==='Enter') enviarMsg()"
                    >
                    <button 
                        onclick="enviarMsg()"
                        disabled
                        id="sendBtn"
                        class="bg-primary text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors duration-200 disabled:bg-gray-300 disabled:cursor-not-allowed"
                    >
                        📤 Enviar
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 text-gray-500 text-sm">
            <p>🌐 Desenvolvido com Socket.IO e Tailwind CSS</p>
        </div>
    </div>
    <script>
        const socket = io('http://localhost:3000');
        let salaAtual = null;

        function entrarSala(){
            salaAtual = document.getElementById('sala').value.trim();
            if(salaAtual) {
                socket.emit('entrarSala', salaAtual);
                
                // Update UI
                document.getElementById('currentRoom').textContent = salaAtual;
                document.getElementById('roomIndicator').classList.remove('hidden');
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('msg').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('msg').focus();
                
                // Clear previous messages
                document.getElementById('chat').innerHTML = '';
                
                adicionarMensagem(`🎉 Você entrou na sala: ${salaAtual}`, 'system');
            } else {
                mostrarNotificacao('Por favor, digite o nome da sala.', 'error');
            }
        }   
        
        function enviarMsg(){
            const msg = document.getElementById('msg').value.trim();
            if(msg && salaAtual) {
                socket.emit('mensagemSala', { sala: salaAtual, mensagem: msg });
                document.getElementById('msg').value = '';
            } else {
                mostrarNotificacao('Por favor, digite uma mensagem e entre em uma sala.', 'warning');
            }
        }

        function adicionarMensagem(msg, tipo = 'message') {
            const chat = document.getElementById('chat');
            const li = document.createElement('li');
            
            // Style based on message type
            if (tipo === 'system') {
                li.className = 'bg-blue-100 text-blue-800 p-3 rounded-lg border-l-4 border-blue-400';
                li.innerHTML = `<span class="font-semibold">${msg}</span>`;
            } else if (tipo === 'user') {
                li.className = 'bg-green-100 text-green-800 p-3 rounded-lg ml-8 border-l-4 border-green-400';
                li.innerHTML = `<span class="font-semibold">Você:</span> ${msg}`;
            } else {
                li.className = 'bg-gray-100 text-gray-800 p-3 rounded-lg mr-8 border-l-4 border-gray-400';
                const timestamp = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                li.innerHTML = `<span class="font-semibold text-primary">Usuário:</span> ${msg} <span class="text-xs text-gray-500 float-right">${timestamp}</span>`;
            }
            
            chat.appendChild(li);
            
            // Auto scroll to bottom
            chat.scrollTop = chat.scrollHeight;
        }

        function mostrarNotificacao(mensagem, tipo = 'info') {
            // Create notification element
            const notification = document.createElement('div');
            const bgColor = tipo === 'error' ? 'bg-red-500' : tipo === 'warning' ? 'bg-yellow-500' : 'bg-blue-500';
            
            notification.className = `fixed top-4 right-4 ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg z-50 transform transition-all duration-300 translate-x-full`;
            notification.textContent = mensagem;
            
            document.body.appendChild(notification);
            
            // Animate in
            setTimeout(() => {
                notification.classList.remove('translate-x-full');
            }, 100);
            
            // Remove after 3 seconds
            setTimeout(() => {
                notification.classList.add('translate-x-full');
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }

        socket.on('mensagem',(msg) =>{
            adicionarMensagem(msg);
        });

        // Handle Enter key press
        document.getElementById('sala').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                entrarSala();
            }
        });
    </script>
</body>
</html>
